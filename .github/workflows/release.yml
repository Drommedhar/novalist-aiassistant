name: Release Extension

on:
  push:
    tags:
      - "v*"

env:
  DOTNET_VERSION: 8.0.x
  EXTENSION_ID: com.novalist.ai
  CONFIGURATION: Release

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Checked out beside the SDK rather than at the root of the workspace:
      # the project reference and the locale-check import both point at
      # ..\novalist-official, so the two have to be siblings.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: novalist-aiassistant

      # Built against the SDK source, not the published package. This extension
      # uses SDK surface that reaches NuGet only when the host that introduced
      # it ships, so a release built against the package fails until then, and
      # one built against a stale package is worse - it compiles and then the
      # host refuses to load what it produced.
      - name: Check out the SDK
        uses: actions/checkout@v4
        with:
          repository: Drommedhar/novalist-official
          path: novalist-official

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set version in extension.json
        working-directory: novalist-aiassistant
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" '.version = $v' extension.json > extension.tmp && mv extension.tmp extension.json

      # No UseLocalSdk=false: leaving it unset is what selects the project
      # reference over the package.
      - name: Restore
        working-directory: novalist-aiassistant
        run: dotnet restore

      - name: Build
        working-directory: novalist-aiassistant
        run: >-
          dotnet build
          -c ${{ env.CONFIGURATION }}
          --no-restore

      - name: Create extension ZIP
        working-directory: novalist-aiassistant
        run: |
          cd bin/${{ env.CONFIGURATION }}/net8.0
          # The SDK assembly is left out on purpose: the host supplies it, and
          # shipping a copy is how an extension ends up loading two different
          # versions of the same types. A project reference copies it into the
          # output where a package reference did not, so this is now a list of
          # what to include rather than everything that is there.
          zip ${{ github.workspace }}/${{ env.EXTENSION_ID }}.zip \
            Novalist.Extensions.AiAssistant.dll \
            extension.json \
            Locales/*.json \
            web/*.html

      # The store reads compatibility, the icon and the page from the release
      # when they are there, and falls back to the manifest at the repository
      # root when they are not. That fallback reads the file at the tagged
      # commit, which is the unstamped one - so the store showed the version
      # from the last time somebody edited the file by hand rather than the
      # version actually in the ZIP.
      - name: Publish the manifest and the store page beside the ZIP
        working-directory: novalist-aiassistant
        run: |
          cp extension.json "${GITHUB_WORKSPACE}/${EXTENSION_ID}.extension.json"
          cp README.md "${GITHUB_WORKSPACE}/${EXTENSION_ID}.README.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.EXTENSION_ID }}.zip
            ${{ env.EXTENSION_ID }}.extension.json
            ${{ env.EXTENSION_ID }}.README.md
