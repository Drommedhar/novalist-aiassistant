<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script src="__novalist/theme.js"></script>
<title>Character Chat</title>
<style>
:root {
  /* Novalist hands the whole --nl-* set to a panel that asks for it (the theme
     shim above). Each name below is the app token it corresponds to, so this
     panel follows the writer's theme; the hex is the fallback for a host too
     old to send anything. */
  --bg: var(--nl-surface-editor, #1e1e1e);
  --card: var(--nl-surface-card, #252526);
  --border: var(--nl-border, #333);
  --text: var(--nl-text, #e6edf3);
  --dim: var(--nl-text-dim, #b9bac5);
  --subtle: var(--nl-text-subtle, #848b91);
  --accent: var(--nl-accent, #0e8bdf);
  /* The label colour on the accent. White is wrong on a gold accent, which is
     what Novalist's own theme uses. */
  --on-accent: var(--nl-accent-ink, #fff);
  --warn: var(--nl-warning, #f5a623);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column;
  font-family: var(--nl-font-family, system-ui, sans-serif);
  font-size: var(--nl-font-ui, 13px);
  line-height: 1.5;
  background: var(--bg); color: var(--text);
}
#setup { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--border); }
select {
  flex: 1; font: inherit; color: var(--text); background: var(--card);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px;
}
#status { font-size: 11px; color: var(--subtle); padding: 0 12px; }
#turns { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.turn { max-width: 85%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; }
.turn .speaker { font-size: 11px; color: var(--subtle); margin-bottom: 2px; }
.turn.user { align-self: flex-end; background: var(--accent); color: var(--on-accent); }
.turn.character { align-self: flex-start; background: var(--card); border: 1px solid var(--border); }
#composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
#input {
  flex: 1; resize: none; font: inherit; color: var(--text);
  background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px;
}
button {
  font: inherit; border: none; border-radius: 8px; padding: 8px 14px;
  background: var(--accent); color: var(--on-accent); cursor: pointer;
}
button.secondary { background: var(--card); color: var(--dim); border: 1px solid var(--border); }
button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div id="setup">
  <select id="character"></select>
  <select id="scene"></select>
</div>
<div id="status"></div>
<div id="turns"></div>
<div id="composer">
  <textarea id="input" rows="2" data-i18n-ph="placeholder" placeholder="Speak with your character..."></textarea>
  <button id="send" data-i18n="send">Send</button>
  <button id="cancel" class="secondary" data-i18n="stop" hidden>Stop</button>
  <button id="reset" class="secondary" data-i18n="reset">Reset</button>
</div>
<script>
const characterEl = document.getElementById('character');
const sceneEl = document.getElementById('scene');
const statusEl = document.getElementById('status');
// Localisation: every label comes from the host, so the view holds no English
// of its own and follows the project language.
let S = {};
function t(key, fallback) { return S[key] || fallback || ''; }
function tf(key, fallback, ...args) {
  return t(key, fallback).replace(/\{(\d+)\}/g, (m, i) => args[Number(i)] ?? m);
}
function applyStrings(map) {
  if (!map) return;
  S = map;
  for (const el of document.querySelectorAll('[data-i18n]')) {
    const v = S[el.getAttribute('data-i18n')];
    if (v) el.textContent = v;
  }
  for (const el of document.querySelectorAll('[data-i18n-ph]')) {
    const v = S[el.getAttribute('data-i18n-ph')];
    if (v) el.setAttribute('placeholder', v);
  }
}
const turnsEl = document.getElementById('turns');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const cancelBtn = document.getElementById('cancel');
const resetBtn = document.getElementById('reset');
let streamEl = null;

function post(msg) {
  parent.postMessage({ novalistExt: JSON.stringify(msg) }, '*');
}

function addTurn(speaker, text, isCharacter) {
  const el = document.createElement('div');
  el.className = 'turn ' + (isCharacter ? 'character' : 'user');
  const sp = document.createElement('div');
  sp.className = 'speaker';
  sp.textContent = speaker;
  el.appendChild(sp);
  el.appendChild(document.createTextNode(text));
  turnsEl.appendChild(el);
  turnsEl.scrollTop = turnsEl.scrollHeight;
}

function fillSelect(el, options, selectedId) {
  el.textContent = '';
  for (const option of options) {
    const node = document.createElement('option');
    node.value = option.id;
    node.textContent = option.name || option.label;
    if (option.id === selectedId) node.selected = true;
    el.appendChild(node);
  }
}

window.addEventListener('message', (event) => {
  const raw = event.data && event.data.novalistHost;
  if (typeof raw !== 'string') return;
  const msg = JSON.parse(raw);
  applyStrings(msg.strings);
  if (msg.type === 'setup') {
    fillSelect(characterEl, msg.characters, msg.selectedCharacterId);
    fillSelect(sceneEl, msg.scenes, msg.selectedSceneId);
    turnsEl.textContent = '';
    for (const t of msg.turns) addTurn(t.speaker, t.text, t.isCharacter);
  } else if (msg.type === 'turn') {
    if (streamEl) { streamEl.remove(); streamEl = null; }
    addTurn(msg.speaker, msg.text, msg.isCharacter);
  } else if (msg.type === 'state') {
    sendBtn.disabled = msg.isGenerating || msg.isPreparing;
    cancelBtn.hidden = !msg.isGenerating;
    statusEl.textContent = msg.isPreparing ? msg.preparationStatus : '';
    if (msg.isGenerating && msg.streaming) {
      if (!streamEl) {
        streamEl = document.createElement('div');
        streamEl.className = 'turn character';
        turnsEl.appendChild(streamEl);
      }
      streamEl.textContent = msg.streaming;
      turnsEl.scrollTop = turnsEl.scrollHeight;
    }
    if (!msg.isGenerating && streamEl) { streamEl.remove(); streamEl = null; }
  }
});

characterEl.addEventListener('change', () => post({ type: 'selectCharacter', id: characterEl.value }));
sceneEl.addEventListener('change', () => post({ type: 'selectScene', id: sceneEl.value }));

function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  post({ type: 'send', text });
}

sendBtn.addEventListener('click', send);
cancelBtn.addEventListener('click', () => post({ type: 'cancel' }));
resetBtn.addEventListener('click', () => { turnsEl.textContent = ''; post({ type: 'reset' }); });
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

post({ type: 'hydrate' });
</script>
</body>
</html>
