<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Story Analysis</title>
<style>
:root {
  --bg: #1e1e1e; --card: #252526; --border: #333; --text: #e6edf3;
  --dim: #b9bac5; --subtle: #848b91; --accent: #0e8bdf; --warn: #f5a623;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column;
  font: 13px/1.5 system-ui, sans-serif;
  background: var(--bg); color: var(--text);
}
#toolbar { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--border); align-items: center; flex-wrap: wrap; }
select, button {
  font: inherit; color: var(--text); background: var(--card);
  border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
}
button { cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
#progress { font-size: 12px; color: var(--subtle); padding: 4px 12px; }
#findings { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.finding { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.finding .kind { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--warn); }
.finding .title { font-weight: 600; margin: 2px 0; }
.finding .meta { font-size: 11px; color: var(--subtle); }
.finding .excerpt { font-size: 12px; color: var(--dim); border-left: 2px solid var(--border); padding-left: 8px; margin-top: 6px; white-space: pre-wrap; }
.empty { color: var(--subtle); padding: 16px; }
</style>
</head>
<body>
<div id="toolbar">
  <select id="chapter"></select>
  <button id="runChapter" class="primary">Analyse chapter</button>
  <button id="runStory">Analyse whole story</button>
  <select id="filter">
    <option value="all">All findings</option>
    <option value="continuity">Continuity</option>
    <option value="pacing">Pacing</option>
    <option value="character">Character</option>
    <option value="style">Style</option>
  </select>
</div>
<div id="progress"></div>
<div id="findings"><div class="empty">Run an analysis to see findings.</div></div>
<script>
const chapterEl = document.getElementById('chapter');
const filterEl = document.getElementById('filter');
const runChapterBtn = document.getElementById('runChapter');
const runStoryBtn = document.getElementById('runStory');
const progressEl = document.getElementById('progress');
const findingsEl = document.getElementById('findings');

function post(msg) {
  parent.postMessage({ novalistExt: JSON.stringify(msg) }, '*');
}

window.addEventListener('message', (event) => {
  const raw = event.data && event.data.novalistHost;
  if (typeof raw !== 'string') return;
  const msg = JSON.parse(raw);
  if (msg.type === 'setup') {
    chapterEl.textContent = '';
    for (const c of msg.chapters) {
      const option = document.createElement('option');
      option.value = c.guid;
      option.textContent = c.title;
      if (c.guid === msg.selectedChapterGuid) option.selected = true;
      chapterEl.appendChild(option);
    }
  } else if (msg.type === 'state') {
    runChapterBtn.disabled = msg.isAnalysing;
    runStoryBtn.disabled = msg.isAnalysing;
    progressEl.textContent = msg.isAnalysing
      ? `${msg.progressText} (${msg.progressCurrent}/${msg.progressTotal})`
      : '';
  } else if (msg.type === 'findings') {
    findingsEl.textContent = '';
    if (msg.findings.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No findings.';
      findingsEl.appendChild(empty);
      return;
    }
    for (const f of msg.findings) {
      const el = document.createElement('div');
      el.className = 'finding';
      el.innerHTML = '';
      const kind = document.createElement('div');
      kind.className = 'kind';
      kind.textContent = f.findingType;
      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = f.title;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = f.chapter;
      el.append(kind, title, meta);
      if (f.excerpt) {
        const excerpt = document.createElement('div');
        excerpt.className = 'excerpt';
        excerpt.textContent = f.excerpt;
        el.appendChild(excerpt);
      }
      if (f.description) {
        const desc = document.createElement('div');
        desc.className = 'excerpt';
        desc.textContent = f.description;
        el.appendChild(desc);
      }
      findingsEl.appendChild(el);
    }
  }
});

chapterEl.addEventListener('change', () => post({ type: 'selectChapter', guid: chapterEl.value }));
filterEl.addEventListener('change', () => post({ type: 'setFilter', filter: filterEl.value }));
runChapterBtn.addEventListener('click', () => post({ type: 'analyseChapter' }));
runStoryBtn.addEventListener('click', () => post({ type: 'analyseStory' }));

post({ type: 'hydrate' });
</script>
</body>
</html>
