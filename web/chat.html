<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script src="__novalist/theme.js"></script>
<link rel="stylesheet" href="panel-controls.css" />
<title>AI Chat</title>
<style>
:root {
  /* Novalist hands the whole --nl-* set to a panel that asks for it (the theme
     shim above). Each name below is the app token it corresponds to, so this
     panel follows the writer's theme; the hex is the fallback for a host too
     old to send anything. */
  --bg: var(--nl-surface-editor, #1e1e1e);
  --card: var(--nl-surface-card, #252526);
  --border: var(--nl-border, #333);
  --text: var(--nl-text, #e6edf3);
  --dim: var(--nl-text-dim, #b9bac5);
  --subtle: var(--nl-text-subtle, #848b91);
  --accent: var(--nl-accent, #0e8bdf);
  /* The label colour on the accent. White is wrong on a gold accent, which is
     what Novalist's own theme uses. */
  --on-accent: var(--nl-accent-ink, #fff);
  --warn: var(--nl-warning, #f5a623);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column;
  font-family: var(--nl-font-family, system-ui, sans-serif);
  font-size: var(--nl-font-ui, 13px);
  line-height: 1.5;
  background: var(--bg); color: var(--text);
}
#messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--on-accent); }
.msg.assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--border); }
.thinking { font-size: 11px; color: var(--subtle); border-left: 2px solid var(--border); padding-left: 8px; margin-bottom: 6px; }
#composer { display: flex; align-items: center; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
#input {
  flex: 1; min-width: 0; resize: none; field-sizing: content; max-height: min(30vh, 12lh); font: inherit; color: var(--text);
  background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px;
}
button, select {
  font: inherit; border: none; border-radius: 8px; padding: 8px 14px;
  background: var(--accent); color: var(--on-accent); cursor: pointer;
}
button.secondary, select.secondary { background: var(--card); color: var(--dim); border: 1px solid var(--border); }
select { color-scheme: light dark; }
select option { background: var(--card); color: var(--text); }
button:disabled { opacity: .5; cursor: default; }

/* The picker. Deliberately a list of named things rather than a description of
   a strategy: "the scene I am in" and "Mira Vance" are things somebody can
   decide about, whereas "relevant context" is not. */
.chat-popover {
  position: fixed; inset: auto; margin: 0;
  overflow: auto; padding: var(--nl-space-lg, 16px);
  border: 1px solid var(--border); border-radius: var(--nl-radius-lg, 12px);
  background: var(--card); color: var(--text); font: inherit;
  box-shadow: 0 var(--nl-space-tightest, 4px) var(--nl-space-xl, 24px) color-mix(in srgb, var(--bg), transparent 40%);
  overflow-wrap: anywhere;
}
#context:popover-open {
  display: flex; flex-direction: column; gap: 2px;
}
#budgetForm { display: grid; gap: var(--nl-space-sm, 8px); padding-bottom: var(--nl-space-md, 12px); border-bottom: 1px solid var(--border); }
#budgetForm label { display: grid; gap: var(--nl-space-tightest, 4px); }
#budgetForm input {
  width: 100%; font: inherit; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--nl-radius-md, 8px); padding: var(--nl-space-sm, 8px);
}
#budgetForm p { margin: 0; color: var(--dim); font-size: var(--nl-font-caption, 12px); }
.ctx-group {
  font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--dim); margin: 8px 0 2px;
}
.ctx-group:first-child { margin-top: 0; }
.ctx-item { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.ctx-item:hover { color: var(--accent); }
.badge {
  display: inline-block; min-width: 1.4em; margin-left: 6px; padding: 0 4px;
  border-radius: 999px; background: var(--accent); color: var(--on-accent);
  font-size: 11px; text-align: center;
}
/* A notice is the panel telling the writer something rather than the model
   saying it, so it does not look like a reply. */
.msg.notice {
  align-self: stretch; background: transparent; color: var(--dim);
  font-size: 12px; font-style: italic; padding: 2px 0;
}

/* The preview floats over the conversation and scrolls without moving the composer. */
#previewPanel table { width: 100%; border-collapse: collapse; }
#previewPanel th, #previewPanel td { padding: 3px 6px; text-align: left; }
#previewPanel td.num { text-align: right; font-variant-numeric: tabular-nums; }
#previewPanel tr.dropped { opacity: 0.55; }
#previewPanel pre {
  white-space: pre-wrap;
  word-break: break-word;
  font-family: var(--nl-font-mono, ui-monospace, monospace);
  font-size: inherit;
  margin: var(--nl-space-sm, 8px) 0 0;
  padding: var(--nl-space-md, 12px); background: var(--bg); border-radius: var(--nl-radius-md, 8px);
}
.popover-header { display: flex; align-items: center; justify-content: space-between; gap: var(--nl-space-md, 12px); position: sticky; top: 0; z-index: 1; background: var(--card); padding-bottom: var(--nl-space-sm, 8px); border-bottom: 1px solid var(--border); }
#previewContent > p:first-child { margin-top: var(--nl-space-sm, 8px); }
.preview-totals { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--nl-space-sm, 8px); padding-block: var(--nl-space-sm, 8px); margin-bottom: var(--nl-space-sm, 8px); color: var(--dim); font-variant-numeric: tabular-nums; }
.prompt-details summary { cursor: pointer; color: var(--dim); font-weight: 600; padding-block: var(--nl-space-sm, 8px); }
#model { display: flex; align-items: center; justify-content: space-between; gap: var(--nl-space-md, 12px); }
#model::after { content: ''; width: 6px; height: 6px; border: solid currentColor; border-width: 0 1px 1px 0; transform: rotate(45deg); }
#modelMenu:popover-open { display: grid; gap: var(--nl-space-tightest, 4px); }
.model-option { text-align: left; background: transparent; color: var(--text); }
.model-option:hover, .model-option:focus-visible { background: var(--bg); }
.model-option[aria-checked="true"] { background: color-mix(in srgb, var(--accent) 18%, var(--card)); color: var(--text); box-shadow: inset 3px 0 var(--accent); }
</style>
</head>
<body>
<div id="messages"></div>
<div id="context" class="chat-popover" popover="auto" role="dialog" aria-labelledby="contextToggle" hidden>
  <form id="budgetForm">
    <strong data-i18n="chatBudgetTitle">Token budgets</strong>
    <label><span data-i18n="chatBudgetContext">Context budget (tokens)</span><input id="chatContextBudget" type="number" min="500" max="2000000" step="1" required /></label>
    <label><span data-i18n="chatBudgetLength">Context Length (0 = default)</span><input id="chatContextLength" type="number" min="0" max="131072" step="1" required /></label>
    <p data-i18n="chatBudgetHelp">Saved to AI Assistant settings. Context Length also affects LM Studio model loading. Use 0 to avoid an extra chat limit.</p>
    <button id="applyBudgets" class="secondary" type="submit" data-i18n="chatBudgetApply">Apply budgets</button>
    <p id="budgetSummary" role="status"></p>
  </form>
  <div id="contextOptions"></div>
</div>
<div id="previewPanel" class="chat-popover" popover="auto" role="dialog" aria-labelledby="preview" hidden>
  <header class="popover-header"><strong data-i18n="previewTitle">Preview</strong><button id="closePreview" type="button" class="secondary" data-i18n="previewClose">Close</button></header>
  <div id="previewContent"></div>
</div>
<div id="modelMenu" class="chat-popover" popover="auto" role="menu" aria-labelledby="model" hidden></div>
<div id="composer">
  <button id="contextToggle" class="secondary" aria-expanded="false" aria-controls="context" aria-haspopup="dialog"
          data-i18n="context" title="Choose what the model is told">Context<span
          id="contextCount" class="badge" hidden></span></button>
  <textarea id="input" rows="1" data-i18n-ph="placeholder" placeholder="Ask about your story..."></textarea>
  <button id="model" type="button" class="secondary" title="Which model answers this" aria-haspopup="menu" aria-expanded="false" aria-controls="modelMenu" hidden><span id="modelLabel"></span></button>
  <button id="preview" class="secondary" data-i18n="previewTitle" aria-expanded="false" aria-controls="previewPanel" aria-haspopup="dialog"
          title="See exactly what will be sent">Preview</button>
  <button id="send" data-i18n="send">Send</button>
  <button id="cancel" class="secondary" data-i18n="stop" hidden>Stop</button>
  <button id="reset" class="secondary" data-i18n="clear">Clear</button>
</div>
<script>
// Localisation: every label comes from the host, so the view holds no English
// of its own and follows the project language.
let S = {};
function t(key, fallback) { return S[key] || fallback || ''; }
function tf(key, fallback, ...args) {
  return t(key, fallback).replace(/\{(\d+)\}/g, (m, i) => args[Number(i)] ?? m);
}
function applyStrings(map) {
  if (!map) return;
  S = { ...S, ...map };
  for (const el of document.querySelectorAll('[data-i18n]')) {
    const v = S[el.getAttribute('data-i18n')];
    if (v) el.textContent = v;
  }
  for (const el of document.querySelectorAll('[data-i18n-ph]')) {
    const v = S[el.getAttribute('data-i18n-ph')];
    if (v) el.setAttribute('placeholder', v);
  }
}
const messagesEl = document.getElementById('messages');
const modelSelect = document.getElementById('model');
const modelMenu = document.getElementById('modelMenu');
const modelLabel = document.getElementById('modelLabel');
const previewPanel = document.getElementById('previewPanel');
const previewContent = document.getElementById('previewContent');
const previewBtn = document.getElementById('preview');
const contextEl = document.getElementById('context');
const contextOptionsEl = document.getElementById('contextOptions');
const contextBudgetEl = document.getElementById('chatContextBudget');
const contextLengthEl = document.getElementById('chatContextLength');
const applyBudgetsBtn = document.getElementById('applyBudgets');
const budgetSummary = document.getElementById('budgetSummary');
const contextToggle = document.getElementById('contextToggle');
const contextCount = document.getElementById('contextCount');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const cancelBtn = document.getElementById('cancel');
const resetBtn = document.getElementById('reset');
let streamEl = null;
let previewRequestId = 0;

function hidePanel(panel) {
  panel.hidePopover();
  panel.hidden = true;
}

function positionPanel(panel, button) {
  if (panel.hidden) return;
  const gap = 12;
  const viewport = document.documentElement;
  const anchor = button.getBoundingClientRect();
  const width = Math.max(0, Math.min(panel === contextEl ? 400 : panel === modelMenu ? 300 : 760, viewport.clientWidth - gap * 2));
  const above = anchor.top;
  const below = viewport.clientHeight - anchor.bottom;
  const openAbove = above >= below;
  panel.style.width = width + 'px';
  panel.style.maxHeight = Math.max(0, Math.min(viewport.clientHeight * 0.65, (openAbove ? above : below) - gap * 2)) + 'px';
  panel.style.left = Math.max(gap, Math.min(anchor.left, viewport.clientWidth - width - gap)) + 'px';
  panel.style.top = (openAbove ? Math.max(gap, anchor.top - panel.offsetHeight - gap) : anchor.bottom + gap) + 'px';
}

function showPanel(panel, button) {
  for (const other of [contextEl, previewPanel, modelMenu]) if (other !== panel) hidePanel(other);
  panel.hidden = false;
  panel.showPopover({ source: button });
  positionPanel(panel, button);
}

for (const [panel, button] of [[contextEl, contextToggle], [previewPanel, previewBtn], [modelMenu, modelSelect]]) {
  panel.addEventListener('toggle', (event) => {
    panel.hidden = event.newState === 'closed';
    button.setAttribute('aria-expanded', String(!panel.hidden));
  });
}
window.addEventListener('resize', () => {
  positionPanel(contextEl, contextToggle);
  positionPanel(previewPanel, previewBtn);
  positionPanel(modelMenu, modelSelect);
});
document.getElementById('closePreview').addEventListener('click', () => {
  hidePanel(previewPanel);
  previewBtn.focus();
});

function setBudgetSaving(saving) {
  contextBudgetEl.disabled = saving;
  contextLengthEl.disabled = saving;
  applyBudgetsBtn.disabled = saving;
}

function drawBudgets(budgets, force) {
  if (!force && [contextBudgetEl, contextLengthEl].includes(document.activeElement)) return;
  contextBudgetEl.value = String(budgets.contextBudget);
  contextBudgetEl.min = budgets.minimum;
  contextBudgetEl.max = budgets.maximum;
  contextLengthEl.value = String(budgets.contextLength);
  budgetSummary.setAttribute('role', 'status');
  budgetSummary.textContent = tf('chatBudgetSummary', '{0} input tokens · {1} reserved for the answer',
    budgets.inputBudget.toLocaleString(), budgets.outputReserve.toLocaleString());
  positionPanel(contextEl, contextToggle);
}

document.getElementById('budgetForm').addEventListener('submit', (event) => {
  event.preventDefault();
  if (applyBudgetsBtn.disabled || !document.getElementById('budgetForm').reportValidity()) return;
  setBudgetSaving(true);
  post({ type: 'setBudgets', contextBudget: contextBudgetEl.value, contextLength: contextLengthEl.value });
});

function post(msg) {
  parent.postMessage({ novalistExt: JSON.stringify(msg) }, '*');
}

function addMessage(role, text, thinking) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  if (thinking) {
    const th = document.createElement('div');
    th.className = 'thinking';
    th.textContent = thinking;
    el.appendChild(th);
  }
  el.appendChild(document.createTextNode(text));
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

let responseText = '';
let thinkingText = '';
let streamFrame = 0;
let isGenerating = false;
let sendPending = false;

function updateComposer() {
  sendBtn.disabled = sendPending || isGenerating;
  cancelBtn.hidden = !sendPending && !isGenerating;
}

function clearStream() {
  if (streamFrame) cancelAnimationFrame(streamFrame);
  streamFrame = 0;
  if (streamEl) streamEl.remove();
  streamEl = null;
  responseText = '';
  thinkingText = '';
}

function renderStream() {
  if (!isGenerating) {
    if (streamEl) { streamEl.remove(); streamEl = null; }
    return;
  }
  if (!responseText && !thinkingText) return;
  if (!streamEl) {
    streamEl = document.createElement('div');
    streamEl.className = 'msg assistant';
    messagesEl.appendChild(streamEl);
  }
  if (!streamFrame) streamFrame = requestAnimationFrame(() => {
    streamFrame = 0;
    if (!streamEl) return;
    streamEl.textContent = (thinkingText ? '[' + thinkingText + ']\n' : '') + responseText;
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });
}

window.addEventListener('message', (event) => {
  const raw = event.data && event.data.novalistHost;
  if (typeof raw !== 'string') return;
  const msg = JSON.parse(raw);
  applyStrings(msg.strings);
  if (msg.budgets) drawBudgets(msg.budgets, msg.type === 'budgets');
  if (msg.type === 'history') {
    clearStream();
    sendPending = false;
    isGenerating = !!msg.isGenerating;
    responseText = msg.streamingResponse || '';
    thinkingText = msg.streamingThinking || '';
    if (msg.reset) {
      inputEl.value = '';
      hidePanel(previewPanel);
      hidePanel(contextEl);
      previewRequestId++;
      previewContent.textContent = '';
      contextOptionsEl.textContent = '';
      updateCount();
    }
    messagesEl.textContent = '';
    for (const m of msg.messages) addMessage(m.role, m.text, m.thinking);
    updateComposer();
    renderStream();
    if (!contextEl.hidden) post({ type: 'contextOptions' });
  } else if (msg.type === 'message') {
    if (streamEl) { streamEl.remove(); streamEl = null; }
    if (msg.role === 'user') {
      sendPending = false;
      if (inputEl.value.trim() === msg.text) inputEl.value = '';
      updateComposer();
    }
    addMessage(msg.role, msg.text, msg.thinking);
  } else if (msg.type === 'contextOptions') {
    drawContext(msg.groups);
  } else if (msg.type === 'budgets') {
    setBudgetSaving(false);
  } else if (msg.type === 'budgetsRejected') {
    setBudgetSaving(false);
    budgetSummary.setAttribute('role', 'alert');
    budgetSummary.textContent = msg.error;
  } else if (msg.type === 'preview') {
    if (!previewPanel.hidden && msg.requestId === previewRequestId) drawPreview(msg);
  } else if (msg.type === 'models') {
    drawModels(msg);
  } else if (msg.type === 'notice') {
    addMessage('notice', msg.text);
  } else if (msg.type === 'sendRejected') {
    sendPending = false;
    if (!inputEl.value) inputEl.value = msg.text;
    if (msg.error) addMessage('error', msg.error);
    updateComposer();
  } else if (msg.type === 'sendAccepted') {
    sendPending = false;
    updateComposer();
  } else if (msg.type === 'previewRejected') {
    if (!previewPanel.hidden && msg.requestId === previewRequestId) {
      hidePanel(previewPanel);
      addMessage('error', msg.error);
    }
  } else if (msg.type === 'state') {
    if (msg.reset) { responseText = ''; thinkingText = ''; }
    responseText += msg.streamingDelta || '';
    thinkingText += msg.thinkingDelta || '';
    isGenerating = !!msg.isGenerating;
    if (isGenerating) sendPending = false;
    updateComposer();
    renderStream();
  }
});

/**
 * The models this provider can serve, so a heavier one can be tried for a
 * single hard paragraph without a trip to Settings and back.
 */
function drawModels(p) {
  const models = p.models || [];
  modelMenu.textContent = '';
  if (models.length === 0) {
    modelSelect.hidden = true;
    hidePanel(modelMenu);
    return;
  }
  // The empty option is the configured default, which is where a session
  // starts and where it goes back to when Settings changes.
  modelSelect.value = p.current || '';
  const choices = [{ id: '', label: t('modelFromSettings', 'Model from Settings') }, ...models];
  modelLabel.textContent = choices.find(model => model.id === modelSelect.value)?.label || modelSelect.value;
  for (const model of choices) {
    const option = document.createElement('button');
    option.type = 'button';
    option.className = 'model-option';
    option.value = model.id;
    option.textContent = model.label || model.id;
    option.setAttribute('role', 'menuitemradio');
    option.setAttribute('aria-checked', String(model.id === modelSelect.value));
    option.addEventListener('click', () => {
      modelSelect.value = model.id;
      modelLabel.textContent = option.textContent;
      for (const item of modelMenu.querySelectorAll('button')) item.setAttribute('aria-checked', String(item === option));
      post({ type: 'setModel', model: model.id });
      hidePanel(modelMenu);
      modelSelect.focus();
    });
    modelMenu.appendChild(option);
  }
  modelSelect.hidden = false;
}

/**
 * What would be sent, block by block, before a token is spent on it.
 *
 * The prompt was assembled and sent in one step and no view showed what went,
 * so a writer who ticked six characters and got an answer that ignored two had
 * no way to find out why.
 */
function drawPreview(p) {
  const lines = p.lines || [];
  const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  if (lines.length === 0) {
    previewContent.innerHTML = '<p>' + esc(t('previewEmpty')) + '</p>';
    positionPanel(previewPanel, previewBtn);
    return;
  }

  const rows = lines.map((l) =>
    '<tr' + (l.kept ? '' : ' class="dropped"') + '><td>' + esc(l.heading) + '</td><td>' +
    esc(l.tier) + '</td><td class="num">' + (l.estimatedTokens || 0).toLocaleString() +
    '</td><td>' + esc(t(l.kept ? 'previewKept' : 'previewDropped')) + '</td></tr>').join('');

  previewContent.innerHTML =
    '<p>' + esc(t('previewHint')) + '</p>' +
    '<div class="preview-totals"><span>' + esc(t('previewTotal')) + ' ' +
    (p.estimatedTokens || 0).toLocaleString() + ' / ' +
    (p.tokenBudget || 0).toLocaleString() + '</span>' +
    '<span>' + esc(t('previewReservedOutput')) + ' ' + (p.outputTokenReserve || 0).toLocaleString() + '</span></div>' +
    '<table><thead><tr>' +
    '<th>' + esc(t('previewBlock')) + '</th>' +
    '<th>' + esc(t('previewTier')) + '</th>' +
    '<th>' + esc(t('previewTokens')) + '</th>' +
    '<th></th></tr></thead><tbody>' + rows + '</tbody></table>' +
    (p.dropped && p.dropped.length ? '<p>' + esc(p.dropped.join(', ')) + '</p>' : '') +
    (p.unavailableCount ? '<p>' + esc(tf('contextExcluded', '', p.unavailableCount)) + '</p>' : '') +
    '<details class="prompt-details"><summary>' + esc(t('previewPrompt', 'Full prompt')) + '</summary><pre>' + esc(p.text) + '</pre></details>';
  previewContent.querySelector('details')?.addEventListener('toggle', () => positionPanel(previewPanel, previewBtn));
  positionPanel(previewPanel, previewBtn);
}

function ticked() {
  return Array.from(contextEl.querySelectorAll('input:checked')).map((b) => b.value);
}

function openModelMenu() {
  showPanel(modelMenu, modelSelect);
  const choices = Array.from(modelMenu.querySelectorAll('button'));
  (choices.find(option => option.value === modelSelect.value) || choices[0])?.focus();
}
modelSelect.addEventListener('click', () => {
  if (!modelMenu.hidden) hidePanel(modelMenu);
  else openModelMenu();
});
modelSelect.addEventListener('keydown', (event) => {
  if (!['ArrowDown', 'ArrowUp'].includes(event.key)) return;
  event.preventDefault();
  openModelMenu();
  if (event.key === 'ArrowUp') Array.from(modelMenu.querySelectorAll('button')).at(-1)?.focus();
});
modelMenu.addEventListener('keydown', (event) => {
  const choices = Array.from(modelMenu.querySelectorAll('button'));
  if (!choices.length || !['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(event.key)) return;
  event.preventDefault();
  const current = choices.indexOf(document.activeElement);
  const next = event.key === 'Home' ? 0 : event.key === 'End' ? choices.length - 1
    : (current + (event.key === 'ArrowDown' ? 1 : -1) + choices.length) % choices.length;
  choices[next].focus();
});

previewBtn.onclick = () => {
  // A second press closes it: the preview is a thing to glance at, not a mode.
  if (!previewPanel.hidden) {
    hidePanel(previewPanel);
    return;
  }
  previewContent.textContent = t('previewLoading', 'Loading preview…');
  showPanel(previewPanel, previewBtn);
  post({ type: 'preview', requestId: ++previewRequestId, text: inputEl.value.trim(), include: ticked() });
};

function updateCount() {
  const n = ticked().length;
  contextCount.textContent = n ? String(n) : '';
  contextCount.hidden = n === 0;
}

function drawContext(groups) {
  const selected = new Set(ticked());
  contextOptionsEl.textContent = '';
  if (!groups || !groups.length) {
    updateCount();
    return;
  }
  const addAll = document.createElement('button');
  addAll.type = 'button';
  addAll.className = 'secondary';
  addAll.textContent = t('contextAddAll', 'Add all');
  addAll.addEventListener('click', () => {
    for (const box of contextEl.querySelectorAll('input[type="checkbox"]')) box.checked = true;
    updateCount();
  });
  contextOptionsEl.appendChild(addAll);
  for (const group of groups) {
    const heading = document.createElement('div');
    heading.className = 'ctx-group';
    heading.textContent = group.title;
    contextOptionsEl.appendChild(heading);

    for (const item of group.items) {
      const label = document.createElement('label');
      label.className = 'ctx-item';
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.value = item.id;
      box.checked = selected.has(item.id);
      box.addEventListener('change', updateCount);
      label.appendChild(box);
      label.appendChild(document.createTextNode(' ' + item.label));
      contextOptionsEl.appendChild(label);
    }
  }
  updateCount();
  positionPanel(contextEl, contextToggle);
}

function send() {
  const text = inputEl.value.trim();
  if (sendBtn.disabled || !text) return;
  sendPending = true;
  updateComposer();
  // What the writer ticked travels with the message. Nothing is inferred: what
  // was sent is exactly what is shown as ticked.
  post({ type: 'send', text, include: ticked() });
}

contextToggle.addEventListener('click', () => {
  const showing = !contextEl.hidden;
  if (showing) hidePanel(contextEl);
  else {
    showPanel(contextEl, contextToggle);
    post({ type: 'contextOptions' });
  }
});

sendBtn.addEventListener('click', send);
cancelBtn.addEventListener('click', () => {
  sendPending = false;
  updateComposer();
  post({ type: 'cancel' });
});
resetBtn.addEventListener('click', () => {
  sendPending = false;
  isGenerating = false;
  clearStream();
  updateComposer();
  messagesEl.textContent = '';
  post({ type: 'reset' });
});
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

post({ type: 'hydrate' });
post({ type: 'models' });
</script>
</body>
</html>
