<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AI Chat</title>
<style>
:root {
  --bg: #1e1e1e; --card: #252526; --border: #333; --text: #e6edf3;
  --dim: #b9bac5; --subtle: #848b91; --accent: #0e8bdf;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column;
  font: 13px/1.5 system-ui, sans-serif;
  background: var(--bg); color: var(--text);
}
#messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
.msg.assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--border); }
.thinking { font-size: 11px; color: var(--subtle); border-left: 2px solid var(--border); padding-left: 8px; margin-bottom: 6px; }
#composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
#input {
  flex: 1; resize: none; font: inherit; color: var(--text);
  background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px;
}
button {
  font: inherit; border: none; border-radius: 8px; padding: 8px 14px;
  background: var(--accent); color: #fff; cursor: pointer;
}
button.secondary { background: var(--card); color: var(--dim); border: 1px solid var(--border); }
button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div id="messages"></div>
<div id="composer">
  <textarea id="input" rows="2" placeholder="Ask about your story..."></textarea>
  <button id="send">Send</button>
  <button id="cancel" class="secondary" hidden>Stop</button>
  <button id="reset" class="secondary">Clear</button>
</div>
<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const cancelBtn = document.getElementById('cancel');
const resetBtn = document.getElementById('reset');
let streamEl = null;

function post(msg) {
  parent.postMessage({ novalistExt: JSON.stringify(msg) }, '*');
}

function addMessage(role, text, thinking) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  if (thinking) {
    const th = document.createElement('div');
    th.className = 'thinking';
    th.textContent = thinking;
    el.appendChild(th);
  }
  el.appendChild(document.createTextNode(text));
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

window.addEventListener('message', (event) => {
  const raw = event.data && event.data.novalistHost;
  if (typeof raw !== 'string') return;
  const msg = JSON.parse(raw);
  if (msg.type === 'history') {
    messagesEl.textContent = '';
    for (const m of msg.messages) addMessage(m.role, m.text, m.thinking);
  } else if (msg.type === 'message') {
    if (streamEl) { streamEl.remove(); streamEl = null; }
    addMessage(msg.role, msg.text, msg.thinking);
  } else if (msg.type === 'state') {
    sendBtn.disabled = msg.isGenerating;
    cancelBtn.hidden = !msg.isGenerating;
    if (msg.isGenerating && (msg.streaming || msg.thinking)) {
      if (!streamEl) {
        streamEl = document.createElement('div');
        streamEl.className = 'msg assistant';
        messagesEl.appendChild(streamEl);
      }
      streamEl.textContent = (msg.thinking ? '[' + msg.thinking + ']\n' : '') + msg.streaming;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    if (!msg.isGenerating && streamEl) { streamEl.remove(); streamEl = null; }
  }
});

function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  post({ type: 'send', text });
}

sendBtn.addEventListener('click', send);
cancelBtn.addEventListener('click', () => post({ type: 'cancel' }));
resetBtn.addEventListener('click', () => { messagesEl.textContent = ''; post({ type: 'reset' }); });
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

post({ type: 'hydrate' });
</script>
</body>
</html>
