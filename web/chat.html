<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AI Chat</title>
<style>
:root {
  --bg: #1e1e1e; --card: #252526; --border: #333; --text: #e6edf3;
  --dim: #b9bac5; --subtle: #848b91; --accent: #0e8bdf;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column;
  font: 13px/1.5 system-ui, sans-serif;
  background: var(--bg); color: var(--text);
}
#messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.msg { max-width: 85%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; }
.msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
.msg.assistant { align-self: flex-start; background: var(--card); border: 1px solid var(--border); }
.thinking { font-size: 11px; color: var(--subtle); border-left: 2px solid var(--border); padding-left: 8px; margin-bottom: 6px; }
#composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); }
#input {
  flex: 1; resize: none; font: inherit; color: var(--text);
  background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px;
}
button {
  font: inherit; border: none; border-radius: 8px; padding: 8px 14px;
  background: var(--accent); color: #fff; cursor: pointer;
}
button.secondary { background: var(--card); color: var(--dim); border: 1px solid var(--border); }
button:disabled { opacity: .5; cursor: default; }

/* The picker. Deliberately a list of named things rather than a description of
   a strategy: "the scene I am in" and "Mira Vance" are things somebody can
   decide about, whereas "relevant context" is not. */
#context {
  max-height: 40vh; overflow-y: auto; padding: 8px 10px;
  border-top: 1px solid var(--border); background: var(--card);
  display: flex; flex-direction: column; gap: 2px;
}
.ctx-group {
  font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--dim); margin: 8px 0 2px;
}
.ctx-group:first-child { margin-top: 0; }
.ctx-item { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.ctx-item:hover { color: var(--accent); }
.badge {
  display: inline-block; min-width: 1.4em; margin-left: 6px; padding: 0 4px;
  border-radius: 999px; background: var(--accent); color: #fff;
  font-size: 11px; text-align: center;
}
/* A notice is the panel telling the writer something rather than the model
   saying it, so it does not look like a reply. */
.msg.notice {
  align-self: stretch; background: transparent; color: var(--dim);
  font-size: 12px; font-style: italic; padding: 2px 0;
}
</style>
</head>
<body>
<div id="messages"></div>
<div id="context" hidden></div>
<div id="composer">
  <button id="contextToggle" class="secondary" aria-expanded="false"
          data-i18n="context" title="Choose what the model is told">Context<span
          id="contextCount" class="badge" hidden></span></button>
  <textarea id="input" rows="2" data-i18n-ph="placeholder" placeholder="Ask about your story..."></textarea>
  <button id="send" data-i18n="send">Send</button>
  <button id="cancel" class="secondary" data-i18n="stop" hidden>Stop</button>
  <button id="reset" class="secondary" data-i18n="clear">Clear</button>
</div>
<script>
// Localisation: every label comes from the host, so the view holds no English
// of its own and follows the project language.
let S = {};
function t(key, fallback) { return S[key] || fallback || ''; }
function tf(key, fallback, ...args) {
  return t(key, fallback).replace(/\{(\d+)\}/g, (m, i) => args[Number(i)] ?? m);
}
function applyStrings(map) {
  if (!map) return;
  S = map;
  for (const el of document.querySelectorAll('[data-i18n]')) {
    const v = S[el.getAttribute('data-i18n')];
    if (v) el.textContent = v;
  }
  for (const el of document.querySelectorAll('[data-i18n-ph]')) {
    const v = S[el.getAttribute('data-i18n-ph')];
    if (v) el.setAttribute('placeholder', v);
  }
}
const messagesEl = document.getElementById('messages');
const contextEl = document.getElementById('context');
const contextToggle = document.getElementById('contextToggle');
const contextCount = document.getElementById('contextCount');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const cancelBtn = document.getElementById('cancel');
const resetBtn = document.getElementById('reset');
let streamEl = null;

function post(msg) {
  parent.postMessage({ novalistExt: JSON.stringify(msg) }, '*');
}

function addMessage(role, text, thinking) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  if (thinking) {
    const th = document.createElement('div');
    th.className = 'thinking';
    th.textContent = thinking;
    el.appendChild(th);
  }
  el.appendChild(document.createTextNode(text));
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

window.addEventListener('message', (event) => {
  const raw = event.data && event.data.novalistHost;
  if (typeof raw !== 'string') return;
  const msg = JSON.parse(raw);
  applyStrings(msg.strings);
  if (msg.type === 'history') {
    messagesEl.textContent = '';
    for (const m of msg.messages) addMessage(m.role, m.text, m.thinking);
  } else if (msg.type === 'message') {
    if (streamEl) { streamEl.remove(); streamEl = null; }
    addMessage(msg.role, msg.text, msg.thinking);
  } else if (msg.type === 'contextOptions') {
    drawContext(msg.groups);
  } else if (msg.type === 'notice') {
    addMessage('notice', msg.text);
  } else if (msg.type === 'state') {
    sendBtn.disabled = msg.isGenerating;
    cancelBtn.hidden = !msg.isGenerating;
    if (msg.isGenerating && (msg.streaming || msg.thinking)) {
      if (!streamEl) {
        streamEl = document.createElement('div');
        streamEl.className = 'msg assistant';
        messagesEl.appendChild(streamEl);
      }
      streamEl.textContent = (msg.thinking ? '[' + msg.thinking + ']\n' : '') + msg.streaming;
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    if (!msg.isGenerating && streamEl) { streamEl.remove(); streamEl = null; }
  }
});

function ticked() {
  return Array.from(contextEl.querySelectorAll('input:checked')).map((b) => b.value);
}

function updateCount() {
  const n = ticked().length;
  contextCount.textContent = n ? String(n) : '';
  contextCount.hidden = n === 0;
}

function drawContext(groups) {
  contextEl.textContent = '';
  if (!groups || !groups.length) {
    contextEl.appendChild(document.createTextNode(''));
    return;
  }
  for (const group of groups) {
    const heading = document.createElement('div');
    heading.className = 'ctx-group';
    heading.textContent = group.title;
    contextEl.appendChild(heading);

    for (const item of group.items) {
      const label = document.createElement('label');
      label.className = 'ctx-item';
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.value = item.id;
      box.addEventListener('change', updateCount);
      label.appendChild(box);
      label.appendChild(document.createTextNode(' ' + item.label));
      contextEl.appendChild(label);
    }
  }
  updateCount();
}

function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  // What the writer ticked travels with the message. Nothing is inferred: what
  // was sent is exactly what is shown as ticked.
  post({ type: 'send', text, include: ticked() });
}

contextToggle.addEventListener('click', () => {
  const showing = !contextEl.hidden;
  contextEl.hidden = showing;
  contextToggle.setAttribute('aria-expanded', String(!showing));
  if (!showing && !contextEl.childElementCount) post({ type: 'contextOptions' });
});

sendBtn.addEventListener('click', send);
cancelBtn.addEventListener('click', () => post({ type: 'cancel' }));
resetBtn.addEventListener('click', () => { messagesEl.textContent = ''; post({ type: 'reset' }); });
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

post({ type: 'hydrate' });
</script>
</body>
</html>
